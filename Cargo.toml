[package]
name = "neleus-db"
version = "0.4.0"
edition = "2024"
# Let-chains in the engine and server need 1.88.
rust-version = "1.88"
# Two binaries ship; without this `cargo run` cannot pick one.
default-run = "neleus-db"
description = "Content-addressed database in Rust for AI agent memory. Every write is a Merkle-DAG object with an offline proof, so you can show what an agent retrieved and when. Immutable history, a retrieval audit log, and policy checks at write time. Local-first, no async runtime."
license = "MIT OR Apache-2.0"
repository = "https://github.com/auralshin/neleus-db"
homepage = "https://github.com/auralshin/neleus-db"
documentation = "https://docs.rs/neleus-db"
readme = "README.md"
keywords = ["merkle", "ai-agents", "provenance", "audit", "content-addressed"]
categories = ["database-implementations", "artificial-intelligence", "cryptography", "data-structures", "finance"]
build = "build.rs"
# Publish only what the crate needs to build and run. Embeds the prebuilt
# console/dist (gitignored, so listed explicitly) so `serve --open` ships a
# working UI; drops sdk/, docs/, console sources, and CI files.
include = [
    "/src/**/*",
    "/benches/**/*",
    "/build.rs",
    "/console/dist/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
# Embed the prebuilt web console (console/dist) into the binary and serve it
# from `serve`. On by default for the shipped binary; turn off for lib-only or
# Node-less builds with `--no-default-features`.
default = ["console"]
console = []

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5.3"
base64 = "0.22"
blake3 = "1.5"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2.0"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_ipld_dagcbor = "0.6"
serde_json = "1.0"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
zstd = "0.13"

[build-dependencies]
# Compress the embedded console assets at build time (served Content-Encoding:
# zstd). Same crate as the runtime dep — no new dependency.
zstd = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
rusqlite = "0.37"
tempfile = "3.16"

[[bin]]
name = "neleus-db"
path = "src/main.rs"

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "state"
harness = false

# Release size/perf tuning. strip removes ~0.7M of symbols; LTO + a single
# codegen unit let the linker drop dead cross-crate code. opt-level stays at the
# default 3 — this is a throughput-sensitive DB, so we trade build time, not
# runtime speed. panic stays `unwind` on purpose: the server is
# thread-per-connection, and `abort` would let one panicking request kill the
# whole daemon.
[profile.release]
strip = true
lto = true
codegen-units = 1

# Crypto/hash/compression deps dominate test and bench runtime. Compiling them
# at opt-level=3 while leaving this crate at opt-level=0 keeps incremental
# builds fast and shrinks the test suite wall time dramatically — measured ~6×
# on the state exhaustive tests. Cached after the first build.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

[[bench]]
name = "compare_sql"
harness = false

[[bench]]
name = "scale"
harness = false

[[bench]]
name = "verifiability"
harness = false

[[bin]]
name = "neleus-verify"
path = "src/bin/neleus-verify.rs"
